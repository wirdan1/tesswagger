<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile REST API - Swagger Documentation</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .redirect-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        
        .api-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        h1 {
            color: #8b5cf6;
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        p {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .redirect-btn {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        
        .redirect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }
        
        .loading {
            margin-top: 20px;
            color: #8b5cf6;
            font-size: 0.9rem;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 50%;
            border-top-color: #8b5cf6;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .redirect-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .api-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="api-icon">🚀</div>
        <h1>Mobile REST API</h1>
        <p>Redirecting to Swagger Documentation...</p>
        <a href="/api-docs" class="redirect-btn">Open API Docs</a>
        <div class="loading">
            <div class="spinner"></div>
            Loading Swagger UI...
        </div>
    </div>

    <script>
        // Auto redirect after 2 seconds
        setTimeout(() => {
            window.location.href = '/api-docs';
        }, 2000);
        
        // Update loading text
        let dots = 0;
        setInterval(() => {
            dots = (dots + 1) % 4;
            const loadingText = document.querySelector('.loading');
            if (loadingText) {
                loadingText.innerHTML = `<div class="spinner"></div>Loading Swagger UI${'...'.substring(0, dots)}`;
            }
        }, 500);
    </script>
</body>
</html>
